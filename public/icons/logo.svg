<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- 铺满画布：内容包围盒 36,20 → 238.5,234.5 等比放大 1.1935 后居中，上下贴边 -->
  <g transform="translate(-35.804 -23.870) scale(1.193473)">
    <!-- 简历：浅灰白，深色背景下高对比 -->
    <rect x="36" y="20" width="132" height="196" rx="16" fill="#F3F4F6"/>

    <!-- 文字线：深灰，不用蓝色 -->
    <g stroke="#4B5563" stroke-width="10" stroke-linecap="round">
      <line x1="62" y1="64" x2="142" y2="64"/>
      <line x1="62" y1="96" x2="142" y2="96"/>
      <line x1="62" y1="128" x2="116" y2="128"/>
    </g>

    <!-- 放大镜：橙色粗环 + 浅灰镜片 + 橙色手柄 -->
    <circle cx="174" cy="170" r="44" fill="#F3F4F6" stroke="#F97316" stroke-width="16"/>
    <line x1="206" y1="202" x2="230" y2="226"
          stroke="#F97316" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
